                      Ui.lp(Ui.MP, Ui.WC, 16)
                  )
              }

              // Only shown while something is still missing, so a finished setup does not
              // take up the top of the screen forever.
              private fun setupCard() {
                  val acc = accessibilityOn(this)
                  val ov = Settings.canDrawOverlays(this)
                  val bat = batteryFree(this)
                  if (acc && ov && bat) return

                  val p = Ui.panel(this)
                  p.addView(Ui.eyebrow(this, "Finish setup"))
                  permRow(p, "See which app is open", acc) {
                      open(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  permRow(p, "Draw over other apps", ov) {
                      val i = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION)
                      i.data = Uri.parse("package:$packageName")
                      open(i)
                  }
                  permRow(p, "Keep running in background", bat) {
                      try {
                          val i = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                          i.data = Uri.parse("package:$packageName")
                          startActivity(i)
                      } catch (e: Throwable) {
                          open(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                      }
                  }
                  content.addView(p, Ui.lp(Ui.MP, Ui.WC, 18))
              }

              private fun permRow(panel: LinearLayout, label: String, done: Boolean, action: () -> Unit) {
                  val r = Ui.row(this)
                  val mark = Ui.text(this, if (done) "\u2713" else "\u2022", 15f, if (done) Ui.GOOD else Ui.MUTED, true)
                  mark.setPadding(0, 0, Ui.dp(10), 0)
                  r.addView(mark)
                  r.addView(Ui.text(this, label, 15f, Ui.TEXT), Ui.weighted())
                  if (!done) r.addView(Ui.button(this, "Open") { action() })
                  panel.addView(r, Ui.lp(Ui.MP, Ui.WC, 14))
              }

              private fun heroCard() {
                  val p = Ui.panel(this)
                  p.addView(Ui.eyebrow(this, "Turned back"))

                  val numRow = Ui.row(this)
                  numRow.gravity = Gravity.BOTTOM
                  numRow.addView(Ui.display(this, Store.goBacks().toString()))
                  val of = Ui.text(this, "of " + Store.opensToday() + " opens", 13f, Ui.MUTED)
                  of.setPadding(Ui.dp(8), 0, 0, Ui.dp(7))
                  numRow.addView(of)
                  p.addView(numRow, Ui.lp(Ui.MP, Ui.WC, 4))

                  p.addView(weekStrip(), Ui.lp(Ui.MP, Ui.WC, 16))
                  content.addView(p, Ui.lp(Ui.MP, Ui.WC, 16))
              }

              private fun weekStrip(): LinearLayout {
                  val days = Store.lastSevenDays()
                  var peak = 1
                  for (d in days) peak = Math.max(peak, d.opens)

                  val box = Ui.col(this)
                  val bars = Ui.row(this)
                  bars.gravity = Gravity.BOTTOM
                  for (d in days) {
                      val cell = Ui.col(this)
                      cell.gravity = Gravity.BOTTOM
                      val bar = View(this)
                      val hgt = Math.max(Ui.dp(4), Ui.dp(44) * d.opens / peak)
                      bar.background = Ui.rounded(if (d.isToday) Ui.ACCENT else Ui.TRACK, 3)
                      cell.addView(bar, LinearLayout.LayoutParams(Ui.MP, hgt))
                      val lp = LinearLayout.LayoutParams(0, Ui.WC, 1f)
                      lp.leftMargin = Ui.dp(3)
                      bars.addView(cell, lp)
                  }
                  box.addView(bars, Ui.lp(Ui.MP, Ui.dp(46), 0))

                  val labels = Ui.row(this)
                  for (d in days) {
                      val t = Ui.text(this, d.label, 10f, Ui.MUTED)
                      t.gravity = Gravity.CENTER
                      val lp = LinearLayout.LayoutParams(0, Ui.WC, 1f)
                      lp.leftMargin = Ui.dp(3)
                      labels.addView(t, lp)
                  }
                  box.addView(labels, Ui.lp(Ui.MP, Ui.WC, 6))
                  return box
              }

              private fun metricCards() {
                  val row = Ui.row(this)
                  row.addView(metric("Guarded", Store.guarded().size.toString(), "apps") {
                      startActivity(Intent(this, AppsActivity::class.java))
                  }, Ui.weighted())
                  row.addView(Ui.gap(this, 10))
                  row.addView(metric("Passes", Store.passesLeft().toString(), "left today") {
                      startActivity(Intent(this, SettingsActivity::class.java))
                  }, Ui.weighted())
                  content.addView(row, Ui.lp(Ui.MP, Ui.WC, 10))
              }

              private fun metric(label: String, value: String, sub: String, onClick: () -> Unit): LinearLayout {
                  val p = Ui.panel(this)
                  p.addView(Ui.eyebrow(this, label))
                  val v = Ui.text(this, value, 26f, Ui.TEXT, true)
                  p.addView(v, Ui.lp(Ui.MP, Ui.WC, 4))
                  p.addView(Ui.text(this, sub, 11f, Ui.MUTED), Ui.lp(Ui.MP, Ui.WC, 0))
                  p.setOnClickListener { onClick() }
                  return p
              }

              private fun guardCard() {
                  val p = Ui.panel(this)
                  Ui.pillRow(
                      this, p,
                      "Guarding",
                      if (Store.enabled()) "Pause screens are running" else "Paused until you switch it back on",
                      Store.enabled(),
                      0
                  ) { on ->
                      Store.setEnabled(on)
                      build()
                  }
                  content.addView(p, Ui.lp(Ui.MP, Ui.WC, 10))
              }

              private fun open(i: Intent) {
                  try {
                      startActivity(i)
                  } catch (e: Throwable) {
                      Toast.makeText(this, "Could not open that settings screen", Toast.LENGTH_SHORT).show()
                  }
              }

              companion object {
                  fun accessibilityOn(c: Context): Boolean {
                      return try {
                          val s = Settings.Secure.getString(
                              c.contentResolver,
                              Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                          ) ?: return false
                          s.split(":").any { it.contains(c.packageName) && it.contains("GuardService") }
                      } catch (e: Throwable) {
                          false
                      }
                  }

                  fun batteryFree(c: Context): Boolean {
                      return try {
                          val pm = c.getSystemService(Context.POWER_SERVICE) as PowerManager
                          pm.isIgnoringBatteryOptimizations(c.packageName)
                      } catch (e: Throwable) {
                          false
                      }
                  }
              }
          }
