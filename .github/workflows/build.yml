          package com.waqt

          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.drawable.Drawable
          import android.os.Bundle
          import android.text.Editable
          import android.text.InputType
          import android.text.TextWatcher
          import android.util.TypedValue
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView

          class AppsActivity : Base() {

              private class Item(val pkg: String, val label: String, val icon: Drawable?)

              private lateinit var content: LinearLayout
              private lateinit var listHost: LinearLayout
              private lateinit var status: TextView
              private var items: List<Item> = ArrayList()
              private var filter = ""

              override fun onCreate(saved: Bundle?) {
                  super.onCreate(saved)
                  content = scaffold(1)

                  content.addView(Ui.title(this, "Apps"))
                  content.addView(
                      Ui.text(this, "Pick the ones that pull you in.", 13f, Ui.MUTED),
                      Ui.lp(Ui.MP, Ui.WC, 2)
                  )

                  val search = EditText(this)
                  search.hint = "Search apps"
                  search.setSingleLine(true)
                  search.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS
                  search.setTextColor(Ui.TEXT)
                  search.setHintTextColor(Ui.MUTED)
                  search.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15f)
                  search.background = Ui.rounded(Ui.CARD, 14, 1, Ui.LINE)
                  search.setPadding(Ui.dp(14), Ui.dp(12), Ui.dp(14), Ui.dp(12))
                  search.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          filter = (s ?: "").toString().trim().lowercase()
                          render()
                      }
                  })
                  content.addView(search, Ui.lp(Ui.MP, Ui.WC, 16))

                  status = Ui.text(this, "Reading your app list\u2026", 13f, Ui.MUTED)
                  content.addView(status, Ui.lp(Ui.MP, Ui.WC, 16))

                  listHost = Ui.col(this)
                  content.addView(listHost, Ui.lp(Ui.MP, Ui.WC, 0))

                  Thread {
                      val found = load()
                      runOnUiThread {
                          items = found
                          status.visibility = TextView.GONE
                          render()
                      }
                  }.start()
              }

              override fun onResume() {
                  super.onResume()
                  if (items.isNotEmpty()) render()
              }

              private fun load(): List<Item> {
                  val out = ArrayList<Item>()
                  try {
                      val pm = packageManager
                      val main = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                      val home = pm.resolveActivity(
                          Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME),
                          PackageManager.MATCH_DEFAULT_ONLY
                      )?.activityInfo?.packageName ?: ""
                      val seen = HashSet<String>()
                      for (ri in pm.queryIntentActivities(main, 0)) {
                          val p = ri.activityInfo.packageName
                          if (p == packageName || p == home) continue
                          if (GuardService.NEVER.contains(p)) continue
                          if (!seen.add(p)) continue
                          out.add(Item(p, ri.loadLabel(pm).toString(), ri.loadIcon(pm)))
                      }
                  } catch (e: Throwable) {
                  }
                  out.sortWith(compareBy { it.label.lowercase() })
                  return out
              }

              private fun render() {
                  listHost.removeAllViews()
                  val guardedSet = Store.guarded()
                  val on = ArrayList<Item>()
                  val off = ArrayList<Item>()
                  for (i in items) {
                      if (filter.isNotEmpty() && !i.label.lowercase().contains(filter)) continue
                      if (guardedSet.contains(i.pkg)) on.add(i) else off.add(i)
                  }

                  if (on.isNotEmpty()) {
                      listHost.addView(Ui.eyebrow(this, "Guarded \u00b7 " + on.size), Ui.lp(Ui.MP, Ui.WC, 0))
                      listHost.addView(group(on, true), Ui.lp(Ui.MP, Ui.WC, 8))
                  }
                  if (off.isNotEmpty()) {
                      listHost.addView(
                          Ui.eyebrow(this, "Everything else"),
                          Ui.lp(Ui.MP, Ui.WC, if (on.isEmpty()) 0 else 22)
                      )
                      listHost.addView(group(off, false), Ui.lp(Ui.MP, Ui.WC, 8))
                  }
                  if (on.isEmpty() && off.isEmpty()) {
                      listHost.addView(
                          Ui.text(this, "Nothing matches \u201c$filter\u201d.", 14f, Ui.MUTED),
                          Ui.lp(Ui.MP, Ui.WC, 8)
                      )
                  }
              }

              private fun group(list: List<Item>, guarded: Boolean): LinearLayout {
                  val box = Ui.col(this)
                  box.background = Ui.rounded(Ui.CARD, 20)
                  box.setPadding(Ui.dp(6), Ui.dp(6), Ui.dp(6), Ui.dp(6))
                  for (i in list.indices) {
                      if (i > 0) {
                          val line = Ui.hairline(this)
                          val lp = LinearLayout.LayoutParams(Ui.MP, Math.max(1, Ui.dp(1) / 2))
                          lp.leftMargin = Ui.dp(8)
                          lp.rightMargin = Ui.dp(8)
                          box.addView(line, lp)
                      }
                      box.addView(row(list[i], guarded))
                  }
                  return box
              }

              private fun row(item: Item, guarded: Boolean): LinearLayout {
                  val row = Ui.row(this)
                  row.setPadding(Ui.dp(8), Ui.dp(10), Ui.dp(8), Ui.dp(10))

                  val iv = ImageView(this)
                  if (item.icon != null) iv.setImageDrawable(item.icon)
                  val ilp = LinearLayout.LayoutParams(Ui.dp(34), Ui.dp(34))
                  ilp.rightMargin = Ui.dp(12)
                  row.addView(iv, ilp)

                  val stack = Ui.col(this)
                  stack.addView(Ui.text(this, item.label, 15f, Ui.TEXT))
                  if (guarded) {
                      stack.addView(
                          Ui.text(this, Store.ruleSummary(item.pkg), 12f, Ui.MUTED),
                          Ui.lp(Ui.MP, Ui.WC, 1)
                      )
                  }
                  stack.setOnClickListener {
                      if (Store.guarded().contains(item.pkg)) openRule(item)
                  }
                  row.addView(stack, Ui.weighted())

                  row.addView(Ui.pill(this, guarded) { on ->
                      val set = Store.guarded()
                      if (on) set.add(item.pkg) else set.remove(item.pkg)
                      Store.setGuarded(set)
                      render()
                  }, Ui.pillLp())

                  return row
              }

              private fun openRule(item: Item) {
                  val i = Intent(this, AppRuleActivity::class.java)
                  i.putExtra("pkg", item.pkg)
                  i.putExtra("label", item.label)
                  startActivity(i)
              }
          }
