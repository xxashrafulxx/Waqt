          package com.waqt

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.SeekBar
          import android.widget.TextView
          import java.util.Random

          // Every challenge is tap-, hold- or swipe-driven. Nothing here opens the system
          // keyboard: an IME over a TYPE_APPLICATION_OVERLAY window is unreliable across
          // OEMs and was the source of the overlapping layout.
          object Challenges {

              private val rnd = Random()
              private val h = Handler(Looper.getMainLooper())

              private val CHIP = Color.parseColor("#2BFFFFFF")
              private val CHIP_LINE = Color.parseColor("#33FFFFFF")
              private val CHIP_ON = Color.parseColor("#FAFAF7")
              private val CHIP_ON_TEXT = Color.parseColor("#12120F")
              private val FG = Color.parseColor("#FAFAF7")
              private val FG_SOFT = Color.parseColor("#99FFFFFF")

              private val WORDS = arrayOf(
                  "deliberate", "afterwards", "attention", "elsewhere", "tomorrow",
                  "unfinished", "somewhere", "gradually", "remaining", "otherwise",
                  "important", "carefully", "beginning", "difficult", "returning"
              )

              private val DIRS = arrayOf("LEFT", "RIGHT", "UP", "DOWN")

              // Called when the overlay tears down, so a hold timer or reset callback from a
              // dismissed challenge can never fire and unlock a later screen.
              fun cancelAll() {
                  h.removeCallbacksAndMessages(null)
              }

              fun make(ctx: Context, level: Int, onOk: () -> Unit): Pair<String, View> {
                  return when (rnd.nextInt(6)) {
                      0 -> order(ctx, level, onOk)
                      1 -> swipe(ctx, level, onOk)
                      2 -> hold(ctx, level, onOk)
                      3 -> spell(ctx, level, onOk)
                      4 -> math(ctx, level, onOk)
                      else -> slider(ctx, level, onOk)
                  }
              }

              // ---- shared pieces ----

              private fun stage(c: Context, heightDp: Int): FrameLayout {
                  val f = FrameLayout(c)
                  f.layoutParams = LinearLayout.LayoutParams(Ui.MP, Ui.dp(heightDp))
                  return f
              }

              private fun key(c: Context, label: String, sizeSp: Float = 18f): TextView {
                  val t = TextView(c)
                  t.text = label
                  t.gravity = Gravity.CENTER
                  t.setTextColor(FG)
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sizeSp)
                  t.typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  t.background = Ui.rounded(CHIP, 12, 1, CHIP_LINE)
                  return t
              }

              private fun setKeyOn(t: TextView, on: Boolean) {
                  if (on) {
                      t.background = Ui.rounded(CHIP_ON, 12)
                      t.setTextColor(CHIP_ON_TEXT)
                  } else {
                      t.background = Ui.rounded(CHIP, 12, 1, CHIP_LINE)
                      t.setTextColor(FG)
                  }
              }

              private fun circle(c: Context, label: String): TextView {
                  val t = TextView(c)
                  t.text = label
                  t.gravity = Gravity.CENTER
                  t.setTextColor(FG)
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, 19f)
                  t.typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  val d = GradientDrawable()
                  d.shape = GradientDrawable.OVAL
                  d.setColor(CHIP)
                  d.setStroke(Ui.dp(1), CHIP_LINE)
                  t.background = d
                  return t
              }

              private fun grid(c: Context, cells: List<View>, columns: Int, cellHeightDp: Int): LinearLayout {
                  val box = Ui.col(c)
                  var i = 0
                  while (i < cells.size) {
                      val row = Ui.row(c)
                      for (j in 0 until columns) {
                          if (i + j < cells.size) {
                              val lp = LinearLayout.LayoutParams(0, Ui.dp(cellHeightDp), 1f)
                              lp.leftMargin = if (j == 0) 0 else Ui.dp(6)
                              row.addView(cells[i + j], lp)
                          } else {
                              val filler = View(c)
                              val lp = LinearLayout.LayoutParams(0, Ui.dp(cellHeightDp), 1f)
                              lp.leftMargin = Ui.dp(6)
                              row.addView(filler, lp)
                          }
                      }
                      box.addView(row, Ui.lp(Ui.MP, Ui.WC, if (i == 0) 0 else 6))
                      i += columns
                  }
                  return box
              }

              private fun readout(c: Context, sizeSp: Float): TextView {
                  val t = TextView(c)
                  t.gravity = Gravity.CENTER
                  t.setTextColor(FG)
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sizeSp)
                  t.typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  return t
              }

              // 1. Tap the numbers in order
              private fun order(c: Context, level: Int, onOk: () -> Unit): Pair<String, View> {
                  val n = if (level <= 1) 3 else if (level == 2) 5 else 7
                  val f = stage(c, 190)
                  val chips = ArrayList<TextView>()
                  var next = 1

                  f.post {
                      val w = f.width
                      val hgt = f.height
                      if (w <= 0 || hgt <= 0) return@post
                      val size = Ui.dp(52)
                      val cells = ArrayList<Pair<Int, Int>>()
                      for (r in 0..2) for (col in 0..2) cells.add(Pair(col, r))
                      java.util.Collections.shuffle(cells)

                      for (i in 0 until n) {
                          val cell = cells[i % cells.size]
                          val t = circle(c, (i + 1).toString())
                          f.addView(t, FrameLayout.LayoutParams(size, size))
                          val spanX = Math.max(1, w - size)
                          val spanY = Math.max(1, hgt - size)
                          t.x = cell.first * spanX / 2f
                          t.y = cell.second * spanY / 2f
                          chips.add(t)
                          val mine = i + 1
                          t.setOnClickListener {
                              if (mine == next) {
                                  next++
                                  t.alpha = 0.25f
                                  t.isEnabled = false
                                  if (next > n) onOk()
                              } else {
                                  next = 1
                                  for (x in chips) {
                                      x.alpha = 1f
                                      x.isEnabled = true
                                  }
                              }
                          }
                      }
                  }
                  return Pair("Tap 1 to $n in order", f)
              }

              // 2. Swipe the direction shown
              private fun swipe(c: Context, level: Int, onOk: () -> Unit): Pair<String, View> {
                  val need = Math.max(1, level)
                  val f = stage(c, 170)
                  val t = readout(c, 25f)
                  f.addView(t, FrameLayout.LayoutParams(Ui.MP, Ui.MP))

                  var target = DIRS[rnd.nextInt(4)]
                  var done = 0
                  fun render() {
                      t.text = "Swipe $target\n$done of $need"
                  }
                  render()

                  var sx = 0f
                  var sy = 0f
                  f.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = e.x
                              sy = e.y
                          }
                          MotionEvent.ACTION_UP -> {
                              val dx = e.x - sx
                              val dy = e.y - sy
                              if (Math.max(Math.abs(dx), Math.abs(dy)) > Ui.dp(56)) {
                                  val dir = if (Math.abs(dx) > Math.abs(dy)) {
                                      if (dx > 0) "RIGHT" else "LEFT"
                                  } else {
                                      if (dy > 0) "DOWN" else "UP"
                                  }
                                  if (dir == target) {
                                      done++
                                      if (done >= need) {
                                          t.text = "Done"
                                          onOk()
                                      } else {
                                          target = DIRS[rnd.nextInt(4)]
                                          render()
                                      }
                                  } else {
                                      done = 0
                                      target = DIRS[rnd.nextInt(4)]
                                      render()
                                  }
                              }
                          }
                      }
                      true
                  }
                  return Pair("Swipe the way it tells you", f)
              }

              // 3. Press and hold
              private fun hold(c: Context, level: Int, onOk: () -> Unit): Pair<String, View> {
                  val secs = if (level <= 1) 2 else if (level == 2) 4 else 6
                  val box = Ui.col(c)
                  val f = stage(c, 170)

                  val dot = circle(c, "Hold")
                  dot.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                  val size = Ui.dp(92)
                  f.addView(dot, FrameLayout.LayoutParams(size, size))
                  f.post {
                      if (f.width <= size || f.height <= size) return@post
                      dot.x = (0..(f.width - size)).random().toFloat()
                      dot.y = (0..(f.height - size)).random().toFloat()
                  }

                  val bar = ProgressBar(c, null, android.R.attr.progressBarStyleHorizontal)
                  bar.max = secs * 10
                  bar.progress = 0

                  box.addView(f)
                  box.addView(bar, Ui.lp(Ui.MP, Ui.WC, 12))

                  var ticker: Runnable? = null
                  var done = false
                  dot.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              if (!done) {
                                  val r = object : Runnable {
                                      override fun run() {
                                          if (!dot.isAttachedToWindow) return
                                          bar.progress = bar.progress + 1
                                          if (bar.progress >= bar.max) {
                                              done = true
                                              dot.text = "Done"
                                              onOk()
                                          } else {
                                              h.postDelayed(this, 100)
                                          }
                                      }
                                  }
                                  ticker = r
                                  h.postDelayed(r, 100)
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              ticker?.let { h.removeCallbacks(it) }
                              if (!done) bar.progress = 0
                          }
                      }
                      true
                  }
                  return Pair("Press and hold the circle for $secs seconds", box)
              }

              // 4. Spell the word by tapping letters in order (replaces the typed challenge)
              private fun spell(c: Context, level: Int, onOk: () -> Unit): Pair<String, View> {
                  val target = WORDS[rnd.nextInt(WORDS.size)]
                  val decoys = if (level <= 1) 2 else if (level == 2) 4 else 6

                  val letters = ArrayList<Char>()
                  for (ch in target) letters.add(ch)
                  val pool = "abcdefghijklmnopqrstuvwxyz"
                  for (i in 0 until decoys) letters.add(pool[rnd.nextInt(pool.length)])
                  java.util.Collections.shuffle(letters)

                  val box = Ui.col(c)
                  val word = readout(c, 21f)
                  word.letterSpacing = 0.14f
                  word.text = target
                  box.addView(word, Ui.lp(Ui.MP, Ui.WC, 0))

                  val slots = readout(c, 19f)
                  slots.setTextColor(FG_SOFT)
                  slots.letterSpacing = 0.14f
                  box.addView(slots, Ui.lp(Ui.MP, Ui.WC, 10))

                  var index = 0
                  val keys = ArrayList<TextView>()

                  fun paintSlots() {
                      val sb = StringBuilder()
                      for (i in target.indices) {
                          sb.append(if (i < index) target[i] else '\u00b7')
                      }
                      slots.text = sb.toString()
                  }
                  paintSlots()

                  for (ch in letters) {
                      val k = key(c, ch.toString(), 17f)
                      keys.add(k)
                      k.setOnClickListener {
                          if (index >= target.length) return@setOnClickListener
                          if (ch == target[index] && k.isEnabled) {
                              index++
                              k.isEnabled = false
                              k.alpha = 0.28f
                              paintSlots()
                              if (index >= target.length) onOk()
                          } else {
                              index = 0
                              for (x in keys) {
                                  x.isEnabled = true
                                  x.alpha = 1f
                              }
                              paintSlots()
                          }
                      }
                  }

                  box.addView(grid(c, keys, 6, 46), Ui.lp(Ui.MP, Ui.WC, 14))
                  return Pair("Tap the letters in order", box)
              }

              // 5. Arithmetic on a built-in keypad
              private fun math(c: Context, level: Int, onOk: () -> Unit): Pair<String, View> {
                  val q: String
                  val ans: Int
                  if (level <= 1) {
                      val a = 11 + rnd.nextInt(80)
                      val b = 11 + rnd.nextInt(80)
                      q = "$a + $b"
                      ans = a + b
                  } else if (level == 2) {
                      val a = 3 + rnd.nextInt(12)
                      val b = 3 + rnd.nextInt(12)
                      q = "$a \u00d7 $b"
                      ans = a * b
                  } else {
                      val a = 4 + rnd.nextInt(11)
                      val b = 4 + rnd.nextInt(11)
                      // Never let the answer go negative: the keypad has no minus sign.
                      val d = 7 + rnd.nextInt(Math.max(1, Math.min(40, a * b - 12)))
                      q = "$a \u00d7 $b \u2212 $d"
                      ans = a * b - d
                  }

                  val box = Ui.col(c)
                  val question = readout(c, 27f)
                  question.text = q
                  box.addView(question, Ui.lp(Ui.MP, Ui.WC, 0))

                  val entry = readout(c, 22f)
                  entry.setTextColor(FG_SOFT)
                  entry.text = "\u00b7"
                  box.addView(entry, Ui.lp(Ui.MP, Ui.WC, 8))

                  val typed = StringBuilder()
                  val keys = ArrayList<TextView>()

                  fun paint() {
                      entry.text = if (typed.isEmpty()) "\u00b7" else typed.toString()
                  }

                  for (i in 1..9) {
                      val k = key(c, i.toString())
                      k.setOnClickListener {
                          if (typed.length < 5) {
                              typed.append(i)
                              paint()
                          }
                      }
                      keys.add(k)
                  }
                  val clear = key(c, "clear", 13f)
                  clear.setOnClickListener {
                      typed.setLength(0)
                      paint()
                  }
                  val zero = key(c, "0")
                  zero.setOnClickListener {
                      if (typed.length < 5) {
                          typed.append(0)
                          paint()
                      }
                  }
                  val enter = key(c, "enter", 13f)
                  enter.setOnClickListener {
                      if (typed.isEmpty()) return@setOnClickListener
                      if (typed.toString().toIntOrNull() == ans) {
                          setKeyOn(enter, true)
                          for (k in keys) k.isEnabled = false
                          onOk()
                      } else {
                          typed.setLength(0)
                          paint()
                          entry.text = "try again"
                      }
                  }
                  keys.add(clear)
                  keys.add(zero)
                  keys.add(enter)

                  box.addView(grid(c, keys, 3, 50), Ui.lp(Ui.MP, Ui.WC, 12))
                  return Pair("Work it out", box)
              }

              // 6. Land the slider on a target
              private fun slider(c: Context, level: Int, onOk: () -> Unit): Pair<String, View> {
                  val target = 12 + rnd.nextInt(77)
                  val tol = if (level <= 1) 3 else if (level == 2) 1 else 0

                  val box = Ui.col(c)
                  val show = readout(c, 26f)

                  val sb = SeekBar(c)
                  sb.max = 100
                  sb.progress = 0
                  sb.setPadding(Ui.dp(4), Ui.dp(12), Ui.dp(4), Ui.dp(10))
                  sb.progressTintList = android.content.res.ColorStateList.valueOf(CHIP_ON)
                  sb.thumbTintList = android.content.res.ColorStateList.valueOf(CHIP_ON)
                  sb.progressBackgroundTintList = android.content.res.ColorStateList.valueOf(CHIP_LINE)

                  fun render() {
                      show.text = sb.progress.toString() + "  /  " + target
                  }
                  render()

                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) = render()
                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {
                          if (Math.abs(sb.progress - target) <= tol) {
                              show.text = "Landed"
                              sb.isEnabled = false
                              onOk()
                          }
                      }
                  })

                  box.addView(show, Ui.lp(Ui.MP, Ui.WC, 0))
                  box.addView(sb, Ui.lp(Ui.MP, Ui.WC, 0))

                  val hint = if (tol == 0) "land on it exactly" else "within $tol"
                  return Pair("Move the slider to $target ($hint)", box)
              }
          }
