          package com.waqt

          import android.app.Activity
          import android.app.TimePickerDialog
          import android.content.Context
          import android.content.Intent
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView

          object Ui {

              // Tokens. Set by theme() before any view is built.
              var BG = 0
              var CARD = 0
              var TEXT = 0
              var MUTED = 0
              var LINE = 0
              var TRACK = 0
              var INK = 0        // primary button fill / switch on
              var ON_INK = 0     // text on INK
              var ACCENT = Color.parseColor("#E8593A")
              var GOOD = Color.parseColor("#2E9E6B")
              var dark = false

              const val MP = ViewGroup.LayoutParams.MATCH_PARENT
              const val WC = ViewGroup.LayoutParams.WRAP_CONTENT

              fun theme(c: Context) {
                  dark = Theme.isDark(c)
                  if (dark) {
                      BG = Color.parseColor("#0F0F0E")
                      CARD = Color.parseColor("#1A1A18")
                      TEXT = Color.parseColor("#FAFAF7")
                      MUTED = Color.parseColor("#8E8E86")
                      LINE = Color.parseColor("#2A2A27")
                      TRACK = Color.parseColor("#2E2E2A")
                      INK = Color.parseColor("#FAFAF7")
                      ON_INK = Color.parseColor("#12120F")
                  } else {
                      BG = Color.parseColor("#F2F1EE")
                      CARD = Color.parseColor("#FFFFFF")
                      TEXT = Color.parseColor("#12120F")
                      MUTED = Color.parseColor("#8A8A82")
                      LINE = Color.parseColor("#E4E3DE")
                      TRACK = Color.parseColor("#E4E3DE")
                      INK = Color.parseColor("#12120F")
                      ON_INK = Color.parseColor("#FFFFFF")
                  }
              }

              fun dp(v: Int): Int = Math.round(v * App.ctx.resources.displayMetrics.density)

              fun rounded(color: Int, radius: Int, strokeW: Int = 0, strokeC: Int = 0): GradientDrawable {
                  val d = GradientDrawable()
                  d.setColor(color)
                  d.cornerRadius = dp(radius).toFloat()
                  if (strokeW > 0) d.setStroke(dp(strokeW), strokeC)
                  return d
              }

              fun col(c: Context): LinearLayout {
                  val l = LinearLayout(c)
                  l.orientation = LinearLayout.VERTICAL
                  return l
              }

              fun row(c: Context): LinearLayout {
                  val l = LinearLayout(c)
                  l.orientation = LinearLayout.HORIZONTAL
                  l.gravity = Gravity.CENTER_VERTICAL
                  return l
              }

              fun text(c: Context, s: String, size: Float = 15f, color: Int = TEXT, bold: Boolean = false): TextView {
                  val t = TextView(c)
                  t.text = s
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, size)
                  t.setTextColor(color)
                  t.setLineSpacing(dp(3).toFloat(), 1f)
                  t.typeface = Typeface.create(if (bold) "sans-serif-medium" else "sans-serif", Typeface.NORMAL)
                  if (size >= 20f) t.letterSpacing = -0.02f
                  return t
              }

              fun title(c: Context, s: String): TextView = text(c, s, 26f, TEXT, true)

              fun eyebrow(c: Context, s: String): TextView {
                  val t = text(c, s.uppercase(), 10f, MUTED, true)
                  t.letterSpacing = 0.12f
                  return t
              }

              // Big display number for the home stat.
              fun display(c: Context, s: String): TextView {
                  val t = TextView(c)
                  t.text = s
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, 52f)
                  t.setTextColor(TEXT)
                  t.letterSpacing = -0.04f
                  t.includeFontPadding = false
                  t.typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  return t
              }

              fun button(c: Context, s: String, primary: Boolean = false, onClick: () -> Unit): Button {
                  val b = Button(c)
                  b.text = s
                  b.isAllCaps = false
                  b.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15f)
                  b.setTextColor(if (primary) ON_INK else TEXT)
                  b.background = rounded(if (primary) INK else CARD, 16, if (primary) 0 else 1, LINE)
                  b.setPadding(dp(18), dp(15), dp(18), dp(15))
                  b.minHeight = 0
                  b.minWidth = 0
                  b.stateListAnimator = null
                  b.elevation = 0f
                  b.typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  b.setOnClickListener { onClick() }
                  return b
              }

              fun panel(c: Context): LinearLayout {
                  val l = col(c)
                  l.background = rounded(CARD, 20)
                  l.setPadding(dp(16), dp(15), dp(16), dp(16))
                  return l
              }

              fun lp(w: Int, h: Int, top: Int = 0): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(w, h)
                  p.topMargin = dp(top)
                  return p
              }

              fun weighted(): LinearLayout.LayoutParams = LinearLayout.LayoutParams(0, WC, 1f)

              fun gap(c: Context, w: Int): View {
                  val v = View(c)
                  v.layoutParams = LinearLayout.LayoutParams(dp(w), dp(1))
                  return v
              }

              fun hairline(c: Context): View {
                  val v = View(c)
                  v.setBackgroundColor(LINE)
                  return v
              }

              // ---- pill toggle (replaces the platform Switch) ----

              fun pillLp(): LinearLayout.LayoutParams = LinearLayout.LayoutParams(dp(46), dp(28))

              fun pill(c: Context, on: Boolean, onChange: (Boolean) -> Unit): FrameLayout {
                  val track = FrameLayout(c)
                  val knob = View(c)
                  var state = on
                  val travel = dp(46 - 22 - 6).toFloat()

                  fun paint(animate: Boolean) {
                      track.background = rounded(if (state) INK else TRACK, 14)
                      val d = GradientDrawable()
                      d.shape = GradientDrawable.OVAL
                      d.setColor(if (state) ON_INK else CARD)
                      knob.background = d
                      if (animate) {
                          knob.animate().translationX(if (state) travel else 0f).setDuration(140).start()
                      } else {
                          knob.translationX = if (state) travel else 0f
                      }
                  }

                  val klp = FrameLayout.LayoutParams(dp(22), dp(22))
                  klp.leftMargin = dp(3)
                  klp.topMargin = dp(3)
                  track.addView(knob, klp)
                  paint(false)
                  track.setOnClickListener {
                      state = !state
                      paint(true)
                      onChange(state)
                  }
                  return track
              }

              fun pillRow(
                  c: Context,
                  parent: LinearLayout,
                  title: String,
                  sub: String,
                  value: Boolean,
                  topGap: Int,
                  onChange: (Boolean) -> Unit
              ) {
                  val row = row(c)
                  val stack = col(c)
                  stack.addView(text(c, title, 15f, TEXT, true))
                  if (sub.isNotEmpty()) stack.addView(text(c, sub, 12f, MUTED), lp(MP, WC, 2))
                  row.addView(stack, weighted())
                  row.addView(pill(c, value, onChange), pillLp())
                  parent.addView(row, lp(MP, WC, topGap))
              }

              // ---- segmented control (theme picker, text anchor, alignment) ----

              fun segmented(
                  c: Context,
                  options: Array<String>,
                  selected: Int,
                  onPick: (Int) -> Unit
              ): LinearLayout {
                  val bar = row(c)
                  bar.background = rounded(TRACK, 14)
                  bar.setPadding(dp(3), dp(3), dp(3), dp(3))
                  val chips = ArrayList<TextView>()

                  fun paint(index: Int) {
                      for (i in chips.indices) {
                          val on = i == index
                          chips[i].background = if (on) rounded(CARD, 11) else null
                          chips[i].setTextColor(if (on) TEXT else MUTED)
                          chips[i].typeface =
                              Typeface.create(if (on) "sans-serif-medium" else "sans-serif", Typeface.NORMAL)
                      }
                  }

                  for (i in options.indices) {
                      val t = text(c, options[i], 13f, MUTED)
                      t.gravity = Gravity.CENTER
                      t.setPadding(dp(6), dp(9), dp(6), dp(9))
                      t.setOnClickListener {
                          paint(i)
                          onPick(i)
                      }
                      chips.add(t)
                      bar.addView(t, LinearLayout.LayoutParams(0, WC, 1f))
                  }
                  paint(selected)
                  return bar
              }

              // ---- slider ----

              fun slider(
                  parent: LinearLayout,
                  title: String,
                  min: Int,
                  max: Int,
                  value: Int,
                  fmt: (Int) -> String,
                  onSet: (Int) -> Unit
              ) {
                  val c = parent.context
                  val head = row(c)
                  val name = text(c, title, 15f, TEXT)
                  val v = text(c, fmt(value), 14f, TEXT, true)
                  head.addView(name, weighted())
                  head.addView(v)
                  parent.addView(head, lp(MP, WC, 18))

                  val sb = SeekBar(c)
                  sb.max = max - min
                  sb.progress = value - min
                  sb.setPadding(dp(2), dp(8), dp(2), dp(2))
                  sb.progressTintList = ColorStateList.valueOf(INK)
                  sb.thumbTintList = ColorStateList.valueOf(INK)
                  sb.progressBackgroundTintList = ColorStateList.valueOf(TRACK)
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          v.text = fmt(p + min)
                          if (fromUser) onSet(p + min)
                      }

                      override fun onStartTrackingTouch(s: SeekBar?) {}
                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  parent.addView(sb, lp(MP, WC, 2))
              }

              // ---- bottom tab bar ----

              fun tabs(act: Activity, current: Int): LinearLayout {
                  val bar = row(act)
                  bar.background = rounded(CARD, 22)
                  bar.setPadding(dp(6), dp(6), dp(6), dp(6))
                  val labels = arrayOf("Today", "Apps", "Screens", "Settings")
                  val targets = arrayOf(
                      MainActivity::class.java,
                      AppsActivity::class.java,
                      CardsActivity::class.java,
                      SettingsActivity::class.java
                  )
                  for (i in labels.indices) {
                      val on = i == current
                      val t = text(act, labels[i], 13f, if (on) ON_INK else MUTED, on)
                      t.gravity = Gravity.CENTER
                      t.setPadding(dp(4), dp(11), dp(4), dp(11))
                      if (on) t.background = rounded(INK, 16)
                      t.setOnClickListener { go(act, targets[i]) }
                      bar.addView(t, LinearLayout.LayoutParams(0, WC, 1f))
                  }
                  return bar
              }

              private fun go(act: Activity, target: Class<*>) {
                  if (act.javaClass == target) return
                  if (target == MainActivity::class.java) {
                      act.finish()
                  } else {
                      act.startActivity(Intent(act, target))
                      if (act !is MainActivity) act.finish()
                  }
                  act.overridePendingTransition(0, 0)
              }

              // ---- active-hours editor, shared by settings and per-app rules ----
              // get() returns [on, startMinute, endMinute, invert]; set(key, value) persists one field.

              fun hoursBlock(
                  act: Activity,
                  panel: LinearLayout,
                  get: () -> IntArray,
                  set: (String, Int) -> Unit
              ) {
                  val onRow = row(act)
                  onRow.addView(text(act, "Only guard during set hours", 15f, TEXT, true), weighted())
                  var refreshBody: (() -> Unit)? = null
                  onRow.addView(pill(act, get()[0] == 1) {
                      set("on", if (it) 1 else 0)
                      refreshBody?.invoke()
                  }, pillLp())
                  panel.addView(onRow, lp(MP, WC, 18))
                  refreshBody = hoursBody(act, panel, get, set)
              }

              // The time pickers and the flip switch, with no enable toggle of its own.
              // Per-app rules supply that toggle themselves, so there are never two
              // switches on screen that look like they do the same thing.
              fun hoursBody(
                  act: Activity,
                  panel: LinearLayout,
                  get: () -> IntArray,
                  set: (String, Int) -> Unit
              ): () -> Unit {
                  var refresh: (() -> Unit)? = null

                  val body = col(act)
                  panel.addView(body, lp(MP, WC, 0))

                  val timeRow = row(act)
                  body.addView(timeRow, lp(MP, WC, 12))

                  val summary = text(act, "", 12f, MUTED)
                  body.addView(summary, lp(MP, WC, 14))

                  val invRow = row(act)
                  invRow.addView(text(act, "Flip it around", 15f, TEXT, true), weighted())
                  invRow.addView(pill(act, get()[3] == 1) {
                      set("inv", if (it) 1 else 0)
                      refresh?.invoke()
                  }, pillLp())
                  body.addView(invRow, lp(MP, WC, 16))

                  fun pick(current: Int, apply: (Int) -> Unit) {
                      try {
                          TimePickerDialog(
                              act,
                              { _, hh, mm -> apply(hh * 60 + mm); refresh?.invoke() },
                              current / 60,
                              current % 60,
                              false
                          ).show()
                      } catch (e: Throwable) {
                      }
                  }

                  val fromBtn = button(act, "") { pick(get()[1]) { set("start", it) } }
                  val toBtn = button(act, "") { pick(get()[2]) { set("end", it) } }
                  timeRow.addView(fromBtn, weighted())
                  timeRow.addView(gap(act, 10))
                  timeRow.addView(toBtn, weighted())

                  val paint: () -> Unit = {
                      val g = get()
                      body.visibility = if (g[0] == 1) View.VISIBLE else View.GONE
                      fromBtn.text = "From " + Store.fmtTime(g[1])
                      toBtn.text = "To " + Store.fmtTime(g[2])
                      summary.text = if (g[3] == 1) {
                          "Guarded apps open freely between " + Store.fmtTime(g[1]) + " and " +
                                  Store.fmtTime(g[2]) + ". Pause screens run the rest of the day."
                      } else {
                          "Pause screens run between " + Store.fmtTime(g[1]) + " and " +
                                  Store.fmtTime(g[2]) + ". Outside that, guarded apps open freely."
                      }
                  }

                  refresh = paint
                  paint.invoke()
                  return paint
              }
          }
