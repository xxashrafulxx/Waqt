              }

              override fun onResume() {
                  super.onResume()
                  listHost.removeAllViews()
                  for (c in Store.cards()) {
                      val panel = Ui.col(this)
                      panel.background = Ui.rounded(c.bgColor, 20)
                      panel.setPadding(Ui.dp(16), Ui.dp(18), Ui.dp(16), Ui.dp(16))

                      val first = if (c.layers.isEmpty()) "(empty)" else c.layers[0].text
                      val preview = Ui.text(this, first, 18f, Color.parseColor("#FAFAF7"), true)
                      preview.maxLines = 3
                      panel.addView(preview)
                      panel.addView(
                          Ui.text(this, c.name, 12f, Color.parseColor("#8CFFFFFF")),
                          Ui.lp(Ui.MP, Ui.WC, 8)
                      )

                      val row = Ui.row(this)
                      row.gravity = Gravity.END
                      row.addView(chip("Edit") { edit(c.id) })
                      row.addView(Ui.gap(this, 8))
                      row.addView(chip("Delete") {
                          val keep = ArrayList<Card>()
                          for (x in Store.cards()) if (x.id != c.id) keep.add(x)
                          if (keep.isEmpty()) {
                              android.widget.Toast
                                  .makeText(this, "Keep at least one screen", android.widget.Toast.LENGTH_SHORT)
                                  .show()
                          } else {
                              Store.saveCards(keep)
                              Bg.clearCache(c.id)
                              Bg.sweepOrphans()
                              onResume()
                          }
                      })
                      panel.addView(row, Ui.lp(Ui.MP, Ui.WC, 16))

                      listHost.addView(panel, Ui.lp(Ui.MP, Ui.WC, 12))
                  }
              }

              private fun chip(label: String, onClick: () -> Unit): android.widget.TextView {
                  val t = Ui.text(this, label, 13f, Color.parseColor("#FAFAF7"), true)
                  t.setPadding(Ui.dp(16), Ui.dp(10), Ui.dp(16), Ui.dp(10))
                  t.background = Ui.rounded(Color.parseColor("#26FFFFFF"), 12, 1, Color.parseColor("#33FFFFFF"))
                  t.setOnClickListener { onClick() }
                  return t
              }
          }
          PPEOF

          echo "  app/src/main/java/com/waqt/EditorActivity.kt"
          cat > app/src/main/java/com/waqt/EditorActivity.kt << 'PPEOF'
          package com.waqt

          import android.app.AlertDialog
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import java.io.FileOutputStream

          class EditorActivity : Base() {

              private var card = Card()
              private var selected = 0
              private var syncing = false

              private lateinit var content: LinearLayout
              private lateinit var preview: FrameLayout
              private lateinit var chipRow: LinearLayout
              private lateinit var textPanelHost: LinearLayout
              private lateinit var nameField: EditText

              private val fonts = arrayOf(
                  "sans-serif", "sans-serif-light", "sans-serif-medium",
                  "sans-serif-condensed", "sans-serif-black", "serif", "monospace", "cursive"
              )

              private val swatches = intArrayOf(
                  Color.WHITE, Color.parseColor("#E9EEF4"), Color.parseColor("#F4D35E"),
                  Color.parseColor("#E8593A"), Color.parseColor("#7FD1AE"), Color.parseColor("#8FB8F0"),
                  Color.parseColor("#C9A7E0"), Color.parseColor("#111111")
              )

              private val bgSwatches = intArrayOf(
                  Color.parseColor("#141412"), Color.parseColor("#0B0E13"), Color.parseColor("#191219"),
                  Color.parseColor("#0F1A17"), Color.parseColor("#16131F"), Color.parseColor("#1C1710"),
                  Color.parseColor("#101C24"), Color.parseColor("#F2EFE6")
              )

              override fun onCreate(saved: Bundle?) {
                  super.onCreate(saved)

                  val id = intent.getStringExtra("id") ?: ""
                  for (c in Store.cards()) if (c.id == id) card = c
                  if (card.layers.isEmpty()) {
                      card.layers.add(TextLayer.of("Say something to yourself.", TextLayer.CENTER, 28f, Color.WHITE, true))
                  }

                  content = scaffold(-1)
                  header(content, "Edit screen", "Text sits in one of three bands, so it can never cover the buttons.")

                  preview = FrameLayout(this)
                  content.addView(preview, Ui.lp(Ui.MP, Ui.dp(300), 18))

                  chipRow = Ui.row(this)
                  content.addView(chipRow, Ui.lp(Ui.MP, Ui.WC, 14))

                  textPanel()
                  backgroundPanel()
                  namePanel()

                  content.addView(Ui.button(this, "Save screen", true) { save() }, Ui.lp(Ui.MP, Ui.WC, 18))

                  render()
              }

              private fun layer(): TextLayer {
                  if (selected >= card.layers.size) selected = 0
                  return card.layers[selected]
              }

              // ---- panels ----

              // Rebuilt whenever the selected line changes, so the sliders and segmented
              // controls always show the values of the line you are actually editing.
              private fun textPanel() {
                  textPanelHost = Ui.col(this)
                  content.addView(textPanelHost, Ui.lp(Ui.MP, Ui.WC, 16))
                  fillTextPanel()
              }

              private fun selectLayer(index: Int) {
                  selected = index
                  fillTextPanel()
                  render()
              }

              private fun fillTextPanel() {
                  textPanelHost.removeAllViews()
                  val p = Ui.panel(this)
                  p.addView(Ui.eyebrow(this, "Line " + (selected + 1)))

                  val brow = Ui.row(this)
                  brow.addView(Ui.button(this, "Add line") {
                      val t = TextLayer()
                      t.text = "New line"
                      t.size = 18f
                      t.anchor = TextLayer.CENTER
                      card.layers.add(t)
                      selectLayer(card.layers.size - 1)
                  }, Ui.weighted())
                  brow.addView(Ui.gap(this, 8))
                  brow.addView(Ui.button(this, "Words") { editWords() }, Ui.weighted())
                  brow.addView(Ui.gap(this, 8))
                  brow.addView(Ui.button(this, "Remove") {
                      if (card.layers.size > 1) {
                          card.layers.removeAt(selected)
                          selectLayer(0)
                      } else {
                          Toast.makeText(this, "Keep at least one line", Toast.LENGTH_SHORT).show()
                      }
                  }, Ui.weighted())
                  p.addView(brow, Ui.lp(Ui.MP, Ui.WC, 12))

                  p.addView(Ui.text(this, "Position", 15f, Ui.TEXT), Ui.lp(Ui.MP, Ui.WC, 16))
                  p.addView(Ui.segmented(this, arrayOf("Top", "Middle", "Bottom"), layer().anchor) {
                      layer().anchor = it
                      render()
                  }, Ui.lp(Ui.MP, Ui.WC, 8))

                  p.addView(Ui.text(this, "Alignment", 15f, Ui.TEXT), Ui.lp(Ui.MP, Ui.WC, 16))
                  p.addView(Ui.segmented(this, arrayOf("Left", "Centre", "Right"), layer().align) {
                      layer().align = it
                      render()
                  }, Ui.lp(Ui.MP, Ui.WC, 8))

                  Ui.slider(p, "Size", 12, 76, layer().size.toInt(), { it.toString() }, {
                      layer().size = it.toFloat()
                      render()
                  })

                  p.addView(Ui.text(this, "Font", 15f, Ui.TEXT), Ui.lp(Ui.MP, Ui.WC, 18))
                  val spin = Spinner(this)
                  val ad = ArrayAdapter(this, android.R.layout.simple_spinner_item, fonts)
                  ad.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)
                  spin.adapter = ad
                  var pos = 0
                  for (i in fonts.indices) if (fonts[i] == layer().font) pos = i
                  spin.setSelection(pos)
                  spin.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, v: View?, position: Int, id: Long) {
                          if (syncing) return
                          layer().font = fonts[position]
                          render()
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
                  p.addView(spin, Ui.lp(Ui.MP, Ui.WC, 6))

                  Ui.pillRow(this, p, "Bold", "", layer().bold, 16) {
                      layer().bold = it
                      render()
                  }

                  p.addView(Ui.text(this, "Colour", 15f, Ui.TEXT), Ui.lp(Ui.MP, Ui.WC, 18))
                  p.addView(swatchRow(swatches) {
                      layer().color = it
                      render()
                  }, Ui.lp(Ui.MP, Ui.WC, 10))

                  textPanelHost.addView(p, Ui.lp(Ui.MP, Ui.WC, 0))
              }

              private fun backgroundPanel() {
                  val p = Ui.panel(this)
                  p.addView(Ui.eyebrow(this, "Background"))
                  p.addView(swatchRow(bgSwatches) {
                      card.bgColor = it
                      render()
                  }, Ui.lp(Ui.MP, Ui.WC, 12))

                  val irow = Ui.row(this)
                  irow.addView(Ui.button(this, "Choose photo") {
                      val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                      i.addCategory(Intent.CATEGORY_OPENABLE)
                      i.type = "image/*"
                      try {
                          startActivityForResult(i, 7)
                      } catch (e: Throwable) {
                          Toast.makeText(this, "No photo picker found", Toast.LENGTH_SHORT).show()
                      }
                  }, Ui.weighted())
                  irow.addView(Ui.gap(this, 8))
                  irow.addView(Ui.button(this, "Remove photo") {
                      card.hasImage = false
                      Bg.clearCache(card.id)
                      render()
                  }, Ui.weighted())
                  p.addView(irow, Ui.lp(Ui.MP, Ui.WC, 12))

                  Ui.slider(p, "Blur", 0, 30, card.blur, { it.toString() }, {
                      card.blur = it
                      render()
                  })
                  Ui.slider(p, "Darken", 0, 85, card.dim, { "$it%" }, {
                      card.dim = it
                      render()
                  })
                  content.addView(p, Ui.lp(Ui.MP, Ui.WC, 14))
              }

              private fun namePanel() {
                  val p = Ui.panel(this)
                  p.addView(Ui.eyebrow(this, "Name"))
                  nameField = EditText(this)
                  nameField.setText(card.name)
                  nameField.setSingleLine(true)
                  nameField.setTextColor(Ui.TEXT)
                  nameField.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16f)
                  nameField.background = Ui.rounded(Ui.BG, 14, 1, Ui.LINE)
                  nameField.setPadding(Ui.dp(14), Ui.dp(13), Ui.dp(14), Ui.dp(13))
                  p.addView(nameField, Ui.lp(Ui.MP, Ui.WC, 12))
                  content.addView(p, Ui.lp(Ui.MP, Ui.WC, 14))
              }

              private fun swatchRow(colors: IntArray, onPick: (Int) -> Unit): LinearLayout {
                  val row = Ui.row(this)
                  for (c in colors) {
                      val v = View(this)
                      v.background = Ui.rounded(c, 10, 1, Ui.LINE)
                      val lp = LinearLayout.LayoutParams(0, Ui.dp(34), 1f)
                      lp.rightMargin = Ui.dp(8)
                      v.setOnClickListener { onPick(c) }
                      row.addView(v, lp)
                  }
                  return row
              }

              private fun editWords() {
                  val e = EditText(this)
                  e.setText(layer().text)
                  e.setPadding(Ui.dp(20), Ui.dp(16), Ui.dp(20), Ui.dp(16))
                  AlertDialog.Builder(this)
                      .setTitle("What should it say?")
                      .setView(e)
                      .setPositiveButton("Set") { _, _ ->
                          layer().text = e.text.toString()
                          render()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              // ---- preview, mirroring the overlay's own band layout ----

              private fun render() {
                  syncing = true
                  preview.removeAllViews()
                  preview.background = Ui.rounded(card.bgColor, 20)
                  preview.clipToOutline = true

                  if (card.hasImage) {
                      val bmp = Bg.blurred(card.id, card.blur)
                      if (bmp != null) {
                          val iv = ImageView(this)
                          iv.scaleType = ImageView.ScaleType.CENTER_CROP
                          iv.setImageBitmap(bmp)
                          preview.addView(iv, FrameLayout.LayoutParams(Ui.MP, Ui.MP))
                          val dim = View(this)
                          dim.setBackgroundColor(Color.argb(card.dim * 255 / 100, 0, 0, 0))
                          preview.addView(dim, FrameLayout.LayoutParams(Ui.MP, Ui.MP))
                      }
                  }

                  val column = Ui.col(this)
                  column.setPadding(Ui.dp(14), Ui.dp(14), Ui.dp(14), Ui.dp(14))
                  preview.addView(column, FrameLayout.LayoutParams(Ui.MP, Ui.MP))

                  val top = Ui.col(this)
                  column.addView(top, Ui.lp(Ui.MP, Ui.WC, 0))
                  val mid = Ui.col(this)
                  mid.gravity = Gravity.CENTER_VERTICAL
                  column.addView(mid, LinearLayout.LayoutParams(Ui.MP, 0, 1f))
                  val bottom = Ui.col(this)
                  column.addView(bottom, Ui.lp(Ui.MP, Ui.WC, 0))

                  val scale = 0.58f
                  for (i in card.layers.indices) {
                      val l = card.layers[i]
                      val tv = TextView(this)
                      tv.text = l.text
                      tv.setTextSize(TypedValue.COMPLEX_UNIT_SP, l.size * scale)
                      tv.setTextColor(l.color)
                      tv.typeface = Typeface.create(l.font, if (l.bold) Typeface.BOLD else Typeface.NORMAL)
                      tv.gravity = when (l.align) {
                          0 -> Gravity.START
                          2 -> Gravity.END
                          else -> Gravity.CENTER_HORIZONTAL
                      }
                      tv.setPadding(Ui.dp(4), Ui.dp(3), Ui.dp(4), Ui.dp(3))
                      if (i == selected) {
                          tv.background = Ui.rounded(Color.TRANSPARENT, 8, 1, Ui.ACCENT)
                      }
                      val band = when (l.anchor) {
                          TextLayer.TOP -> top
                          TextLayer.BOTTOM -> bottom
                          else -> mid
                      }
                      band.addView(tv, Ui.lp(Ui.MP, Ui.WC, if (band.childCount == 0) 0 else 6))
                      val idx = i
                      tv.setOnClickListener {
                          selectLayer(idx)
                      }
                  }

                  // Where the challenge and buttons will sit in the real thing.
                  val reserved = View(this)
                  reserved.background = Ui.rounded(Color.parseColor("#1FFFFFFF"), 12)
                  column.addView(reserved, Ui.lp(Ui.MP, Ui.dp(54), 10))
                  val note = Ui.text(this, "challenge and buttons", 10f, Color.parseColor("#73FFFFFF"))
                  note.gravity = Gravity.CENTER
                  column.addView(note, Ui.lp(Ui.MP, Ui.WC, 4))

                  renderChips()
                  syncing = false
              }

              private fun renderChips() {
                  chipRow.removeAllViews()
                  for (i in card.layers.indices) {
                      val on = i == selected
                      val t = Ui.text(this, "Line " + (i + 1), 13f, if (on) Ui.ON_INK else Ui.MUTED, on)
                      t.setPadding(Ui.dp(14), Ui.dp(9), Ui.dp(14), Ui.dp(9))
                      t.background = Ui.rounded(if (on) Ui.INK else Ui.CARD, 12, 1, Ui.LINE)
                      val lp = LinearLayout.LayoutParams(Ui.WC, Ui.WC)
                      lp.rightMargin = Ui.dp(8)
                      val idx = i
                      t.setOnClickListener {
                          selectLayer(idx)
                      }
                      chipRow.addView(t, lp)
                  }
              }

              private fun save() {
                  card.name = nameField.text.toString().ifBlank { "Untitled screen" }
                  val all = Store.cards()
                  var replaced = false
                  for (i in all.indices) {
                      if (all[i].id == card.id) {
                          all[i] = card
                          replaced = true
                      }
                  }
                  if (!replaced) all.add(card)
                  Store.saveCards(all)
                  Bg.sweepOrphans()
                  Toast.makeText(this, "Saved", Toast.LENGTH_SHORT).show()
                  finish()
              }

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req != 7 || res != RESULT_OK) return
                  val uri = data?.data ?: return
                  Thread {
                      val ok = importImage(uri)
                      runOnUiThread {
                          if (ok) {
                              card.hasImage = true
                              Bg.clearCache(card.id)
                              render()
                          } else {
                              Toast.makeText(this, "Could not read that photo", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }.start()
              }

              private fun importImage(uri: Uri): Boolean {
                  return try {
                      val probe = BitmapFactory.Options()
                      probe.inJustDecodeBounds = true
                      contentResolver.openInputStream(uri)?.use {
                          BitmapFactory.decodeStream(it, null, probe)
                      }
                      var sample = 1
                      while (probe.outWidth / sample > 1400 || probe.outHeight / sample > 1400) sample *= 2
                      val opts = BitmapFactory.Options()
                      opts.inSampleSize = sample
                      val bmp = contentResolver.openInputStream(uri)?.use {
                          BitmapFactory.decodeStream(it, null, opts)
                      } ?: return false
                      FileOutputStream(Bg.file(card.id)).use {
                          bmp.compress(Bitmap.CompressFormat.JPEG, 88, it)
                      }
                      true
                  } catch (e: Throwable) {
                      false
                  }
              }
          }
