      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/waqt-${{ github.run_number }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: waqt-apk
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" out/*.apk \
            --title "Waqt build ${{ github.run_number }}" \
            --notes "Tap the .apk below to install. You will need to allow installs from unknown sources." \
          || gh release upload "$TAG" out/*.apk --clobber
