          package com.waqt

          import android.content.Context
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.WindowInsets
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView

          object Overlay {

              const val PRE = 0
              const val MID = 1
              const val PREVIEW = 2

              private val h = Handler(Looper.getMainLooper())
              private var wm: WindowManager? = null
              private var root: Root? = null
              private var killer: Runnable? = null
              private var ticker: Runnable? = null
              private var mode = PRE

              var pkg = ""
                  private set

              fun showing(): Boolean = root != null

              class Root(c: Context) : FrameLayout(c) {
                  var onBack: (() -> Unit)? = null
                  override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                      if (event.keyCode == KeyEvent.KEYCODE_BACK) {
                          if (event.action == KeyEvent.ACTION_UP) onBack?.invoke()
                          return true
                      }
                      return super.dispatchKeyEvent(event)
                  }
              }

              fun show(ctx: Context, target: String, m: Int, opens: Int, onEnter: () -> Unit) {
                  if (root != null) return
                  if (!Settings.canDrawOverlays(ctx)) return

                  pkg = target
                  mode = m
                  val card = Store.pickCard()

                  val r = Root(ctx)
                  r.setBackgroundColor(card.bgColor)

                  if (card.hasImage) {
                      val bmp = Bg.blurred(card.id, card.blur)
                      if (bmp != null) {
                          val iv = ImageView(ctx)
                          iv.scaleType = ImageView.ScaleType.CENTER_CROP
                          iv.setImageBitmap(bmp)
                          r.addView(iv, FrameLayout.LayoutParams(Ui.MP, Ui.MP))
                          val dimView = View(ctx)
                          dimView.setBackgroundColor(Color.argb(card.dim * 255 / 100, 0, 0, 0))
                          r.addView(dimView, FrameLayout.LayoutParams(Ui.MP, Ui.MP))
                      }
                  }

                  // Single vertical flow. Nothing is absolutely positioned, so text can never
                  // land underneath the challenge or the buttons, whatever the font scale or
                  // whatever the system decides to inset.
                  val column = Ui.col(ctx)
                  column.setPadding(Ui.dp(20), Ui.dp(18), Ui.dp(20), Ui.dp(22))
                  r.addView(column, FrameLayout.LayoutParams(Ui.MP, Ui.MP))
                  applyInsets(column)

                  val topRow = Ui.row(ctx)
                  val level = escalationLevel(m, opens)
                  topRow.addView(pips(ctx, level), Ui.weighted())
                  topRow.addView(
                      Ui.text(
                          ctx,
                          if (m == PREVIEW) "preview" else "$opens today",
                          11f,
                          Color.parseColor("#80FFFFFF")
                      )
                  )
                  column.addView(topRow, Ui.lp(Ui.MP, Ui.WC, 0))

                  val topBand = Ui.col(ctx)
                  column.addView(topBand, Ui.lp(Ui.MP, Ui.WC, 24))

                  val centerBand = Ui.col(ctx)
                  centerBand.gravity = Gravity.CENTER_VERTICAL
                  column.addView(centerBand, LinearLayout.LayoutParams(Ui.MP, 0, 1f))

                  val bottomBand = Ui.col(ctx)
                  column.addView(bottomBand, Ui.lp(Ui.MP, Ui.WC, 0))

                  for (l in card.layers) {
                      val band = when (l.anchor) {
                          TextLayer.TOP -> topBand
                          TextLayer.BOTTOM -> bottomBand
                          else -> centerBand
                      }
                      band.addView(layerView(ctx, l), Ui.lp(Ui.MP, Ui.WC, if (band.childCount == 0) 0 else 10))
                  }

                  // Challenge card
                  val panel = Ui.col(ctx)
                  panel.background = Ui.rounded(Color.parseColor("#1FFFFFFF"), 20, 1, Color.parseColor("#26FFFFFF"))
                  panel.setPadding(Ui.dp(14), Ui.dp(14), Ui.dp(14), Ui.dp(16))
                  column.addView(panel, Ui.lp(Ui.MP, Ui.WC, 18))

                  val prompt = Ui.text(ctx, "", 11f, Color.parseColor("#8CFFFFFF"), true)
                  prompt.letterSpacing = 0.1f
                  prompt.gravity = Gravity.CENTER
                  panel.addView(prompt, Ui.lp(Ui.MP, Ui.WC, 0))

                  val holder = FrameLayout(ctx)
                  panel.addView(holder, Ui.lp(Ui.MP, Ui.WC, 12))

                  val leave = Ui.button(ctx, "Not now, close the app") { leave() }
                  leave.setTextColor(Color.parseColor("#12120F"))
                  leave.background = Ui.rounded(Color.parseColor("#FAFAF7"), 16)
                  column.addView(leave, Ui.lp(Ui.MP, Ui.WC, 12))

                  val passLink = Ui.text(ctx, "", 12f, Color.parseColor("#73FFFFFF"))
                  passLink.gravity = Gravity.CENTER
                  passLink.setPadding(0, Ui.dp(14), 0, 0)
                  column.addView(passLink, Ui.lp(Ui.MP, Ui.WC, 0))

                  r.onBack = { leave() }

                  val lp = WindowManager.LayoutParams(
                      Ui.MP,
                      Ui.MP,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START

                  val manager = ctx.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  try {
                      manager.addView(r, lp)
                  } catch (e: Throwable) {
                      return
                  }
                  wm = manager
                  root = r

                  val useLevel = if (m == MID) Math.min(2, level) else level
                  val wait = when (m) {
                      PRE -> Store.preWaitFor(target)
                      MID -> Math.min(3, Store.preWaitFor(target))
                      else -> 2
                  }

                  fun arm() {
                      val pair = Challenges.make(ctx, useLevel) { unlock(onEnter) }
                      prompt.text = pair.first.uppercase()
                      holder.removeAllViews()
                      holder.addView(pair.second)

                      // The auto-close timer only covers the challenge itself, never the
                      // sit-with-it countdown, so a slow solver is not thrown out mid-answer.
                      armKiller()

                      if (m == PRE && Store.passesPerDay() > 0 && Store.passesLeft() > 0) {
                          passLink.text = "Working? Use a pass \u00b7 " + Store.passesLeft() + " left today"
                          passLink.setOnClickListener {
                              passLink.setOnClickListener(null)
                              passLink.text = "Unlocking a 15 minute pass"
                              val hard = Challenges.make(ctx, 3) {
                                  Store.startPass(pkg)
                                  hide()
                              }
                              prompt.text = hard.first.uppercase()
                              holder.removeAllViews()
                              holder.addView(hard.second)
                              armKiller()
                          }
                      }
                  }

                  if (wait <= 0) {
                      arm()
                  } else {
                      var left = wait
                      val tick = object : Runnable {
                          override fun run() {
                              if (root == null) return
                              if (left <= 0) {
                                  arm()
                              } else {
                                  prompt.text = "SIT WITH IT FOR $left"
                                  left--
                                  h.postDelayed(this, 1000)
                              }
                          }
                      }
                      ticker = tick
                      tick.run()
                  }
              }

              private fun escalationLevel(m: Int, opens: Int): Int {
                  val level = if (!Store.escalate()) 2 else if (opens <= 3) 1 else if (opens <= 8) 2 else 3
                  return if (m == PREVIEW) 1 else level
              }

              private fun pips(c: Context, level: Int): LinearLayout {
                  val row = Ui.row(c)
                  for (i in 0 until 3) {
                      val v = View(c)
                      v.background = Ui.rounded(
                          if (i < level) Color.parseColor("#E8593A") else Color.parseColor("#33FFFFFF"), 2
                      )
                      val lp = LinearLayout.LayoutParams(Ui.dp(16), Ui.dp(3))
                      lp.rightMargin = Ui.dp(4)
                      row.addView(v, lp)
                  }
                  return row
              }

              private fun layerView(c: Context, l: TextLayer): TextView {
                  val tv = TextView(c)
                  tv.text = l.text
                  tv.setTextSize(TypedValue.COMPLEX_UNIT_SP, l.size)
                  tv.setTextColor(l.color)
                  tv.typeface = Typeface.create(l.font, if (l.bold) Typeface.BOLD else Typeface.NORMAL)
                  tv.gravity = when (l.align) {
                      0 -> Gravity.START
                      2 -> Gravity.END
                      else -> Gravity.CENTER_HORIZONTAL
                  }
                  tv.setLineSpacing(Ui.dp(3).toFloat(), 1.05f)
                  if (l.size >= 24f) tv.letterSpacing = -0.02f
                  tv.setShadowLayer(10f, 0f, 3f, Color.argb(140, 0, 0, 0))
                  return tv
              }

              // Keyboard, gesture bar and status bar all report through here. Nothing in the
              // overlay opens an IME today, but padding for it costs nothing and makes the
              // layout safe if a future challenge ever needs one.
              private fun applyInsets(column: View) {
                  column.setOnApplyWindowInsetsListener { v, insets ->
                      var bottom = 0
                      var top = 0
                      try {
                          if (Build.VERSION.SDK_INT >= 30) {
                              val bars = insets.getInsets(WindowInsets.Type.systemBars())
                              val ime = insets.getInsets(WindowInsets.Type.ime())
                              bottom = Math.max(bars.bottom, ime.bottom)
                              top = bars.top
                          } else {
                              @Suppress("DEPRECATION")
                              bottom = insets.systemWindowInsetBottom
                              @Suppress("DEPRECATION")
                              top = insets.systemWindowInsetTop
                          }
                      } catch (e: Throwable) {
                      }
                      v.setPadding(Ui.dp(20), Ui.dp(18) + top, Ui.dp(20), Ui.dp(22) + bottom)
                      insets
                  }
                  column.requestApplyInsets()
              }

              private fun armKiller() {
                  killer?.let { h.removeCallbacks(it) }
                  val k = Runnable { timeout() }
                  killer = k
                  h.postDelayed(k, 60000L)
              }

              private fun unlock(onEnter: () -> Unit) {
                  h.postDelayed({
                      hide()
                      onEnter()
                  }, 200)
              }

              // The user chose to turn back. This counts, and it must not leave a grace
              // window behind, or the refusal would hand back free access on the next open.
              private fun leave() {
                  val m = mode
                  val p = pkg
                  if (m != PREVIEW) {
                      Store.bumpGoBack()
                      Store.markDenied(p)
                  }
                  hide()
                  if (m != PREVIEW) GuardService.instance?.goHome()
              }

              // Auto-close after a minute. Not a decision, so it is not counted as turning
              // back, but it still must not grant grace.
              private fun timeout() {
                  val m = mode
                  val p = pkg
                  if (m != PREVIEW) Store.markDenied(p)
                  hide()
                  if (m != PREVIEW) GuardService.instance?.goHome()
              }

              fun hide() {
                  killer?.let { h.removeCallbacks(it) }
                  killer = null
                  ticker?.let { h.removeCallbacks(it) }
                  ticker = null
                  Challenges.cancelAll()
                  val r = root ?: return
                  root = null
                  try {
                      wm?.removeView(r)
                  } catch (e: Throwable) {
                  }
                  wm = null
              }
          }
