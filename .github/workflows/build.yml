                      "com.android.emergency",
                      "com.android.contacts",
                      "com.google.android.packageinstaller",
                      "com.android.packageinstaller"
                  )
              }

              private val h = Handler(Looper.getMainLooper())
              private var current = ""
              private var mid: Runnable? = null
              private var imes: Set<String> = HashSet()
              private var imesAt = 0L
              private var launcher = ""

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  refreshImes()
                  launcher = try {
                      val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME)
                      packageManager.resolveActivity(i, PackageManager.MATCH_DEFAULT_ONLY)
                          ?.activityInfo?.packageName ?: ""
                  } catch (e: Throwable) {
                      ""
                  }
              }

              // Re-read at most once a minute so switching keyboards mid-session does not
              // leave the new IME looking like an app launch.
              private fun refreshImes() {
                  val now = System.currentTimeMillis()
                  if (now - imesAt < 60000L && imes.isNotEmpty()) return
                  imesAt = now
                  try {
                      val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                      val set = HashSet<String>()
                      for (info in imm.enabledInputMethodList) set.add(info.packageName)
                      imes = set
                  } catch (e: Throwable) {
                  }
              }

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  cancelMid()
                  Overlay.hide()
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  cancelMid()
                  instance = null
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  if (event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return
                  if (pkg.isEmpty()) return
                  if (pkg == packageName) return
                  if (pkg == "com.android.systemui" || pkg == "android") return
                  refreshImes()
                  if (imes.contains(pkg)) return
                  if (pkg == current) return

                  val prev = current
                  current = pkg
                  try {
                      changed(prev, pkg)
                  } catch (e: Throwable) {
                  }
              }

              private fun changed(prev: String, pkg: String) {
                  cancelMid()

                  // If a pause screen was up for the app we just left, the user pressed Home
                  // rather than answering. That is a refusal, not a normal exit, so it must
                  // not open a grace window.
                  val abandoned = Overlay.showing() && Overlay.pkg == prev
                  if (prev.isNotEmpty()) {
                      if (abandoned) Store.markDenied(prev) else Store.markLeft(prev)
                  }
                  if (Overlay.showing() && Overlay.pkg != pkg) Overlay.hide()

                  if (!Store.enabled()) return
                  if (NEVER.contains(pkg)) return
                  if (launcher.isNotEmpty() && pkg == launcher) return
                  if (!Store.guarded().contains(pkg)) return

                  if (!Store.activeNow(pkg)) return
                  if (Store.passActive(pkg)) return

                  if (Store.inGrace(pkg)) {
                      scheduleMid(pkg)
                      return
                  }

                  h.postDelayed({
                      if (current == pkg && !Overlay.showing()) {
                          // Counted here, not before the delay, so a bounce off the icon or a
                          // missing overlay permission does not inflate today's number.
                          val opens = Store.bumpOpen(pkg)
                          Overlay.show(this, pkg, Overlay.PRE, opens) { scheduleMid(pkg) }
                      }
                  }, 220)
              }

              private fun scheduleMid(pkg: String) {
                  cancelMid()
                  val minutes = Store.midMinutesFor(pkg)
                  if (minutes <= 0) return
                  val r = object : Runnable {
                      override fun run() {
                          if (current != pkg || !Store.enabled()) return
                          if (!Store.activeNow(pkg) || Store.passActive(pkg)) {
                              h.postDelayed(this, 60000L)
                              return
                          }
                          if (Overlay.showing() || keyboardUp()) {
                              h.postDelayed(this, 30000L)
                              return
                          }
                          Overlay.show(this@GuardService, pkg, Overlay.MID, Store.opensOf(pkg)) {
                              scheduleMid(pkg)
                          }
                      }
                  }
                  mid = r
                  h.postDelayed(r, minutes * 60000L)
              }

              private fun cancelMid() {
                  mid?.let { h.removeCallbacks(it) }
                  mid = null
              }

              private fun keyboardUp(): Boolean {
                  return try {
                      val ws = windows ?: return false
                      var found = false
                      for (w in ws) {
                          if (w.type == AccessibilityWindowInfo.TYPE_INPUT_METHOD) found = true
                      }
                      found
                  } catch (e: Throwable) {
                      false
                  }
              }

              fun goHome() {
                  try {
                      performGlobalAction(GLOBAL_ACTION_HOME)
                  } catch (e: Throwable) {
                  }
              }
          }
