                  val stack = Ui.col(this)
                  stack.addView(Ui.title(this, "Today"))
                  stack.addView(
                      Ui.text(this, SimpleDateFormat("EEEE d MMMM", Locale.getDefault()).format(Date()), 13f, Ui.MUTED),
                      Ui.lp(Ui.MP, Ui.WC, 2)
