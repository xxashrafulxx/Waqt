          package com.waqt

          import android.app.Activity
          import android.os.Bundle
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.ScrollView

          // Every screen goes through here so the theme is resolved once, before any view
          // is constructed, and so a theme change picked up in Settings (or from the system
          // while the app is backgrounded) rebuilds the screen on the way back.
          abstract class Base : Activity() {

              private var appliedDark = false

              override fun onCreate(saved: Bundle?) {
                  appliedDark = Theme.isDark(this)
                  setTheme(
                      if (appliedDark) android.R.style.Theme_Material_NoActionBar
                      else android.R.style.Theme_Material_Light_NoActionBar
                  )
                  super.onCreate(saved)
                  Ui.theme(this)
                  paintSystemBars()
              }

              override fun onResume() {
                  super.onResume()
                  if (Theme.isDark(this) != appliedDark) recreate()
              }

              private fun paintSystemBars() {
                  try {
                      // Resize rather than pan: the scaffold's ScrollView takes the squeeze,
                      // so a keyboard never lands on top of a field or the tab bar.
                      window.setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE)
                      window.statusBarColor = Ui.BG
                      window.navigationBarColor = Ui.BG
                      var flags = window.decorView.systemUiVisibility
                      flags = if (Ui.dark) {
                          flags and View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR.inv() and
                                  View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR.inv()
                      } else {
                          flags or View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR or
                                  View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                      }
                      window.decorView.systemUiVisibility = flags
                  } catch (e: Throwable) {
                  }
              }

              // Scrolling content column with a pinned tab bar underneath.
              // Pass tab = -1 for sub-screens that should not show tabs.
              protected fun scaffold(tab: Int): LinearLayout {
                  val outer = Ui.col(this)
                  outer.setBackgroundColor(Ui.BG)

                  val scroll = ScrollView(this)
                  scroll.isFillViewport = true
                  scroll.clipToPadding = false

                  val content = Ui.col(this)
                  content.setPadding(Ui.dp(16), Ui.dp(20), Ui.dp(16), Ui.dp(24))
                  scroll.addView(content)
                  outer.addView(scroll, LinearLayout.LayoutParams(Ui.MP, 0, 1f))

                  if (tab >= 0) {
                      val holder = Ui.col(this)
                      holder.setPadding(Ui.dp(12), 0, Ui.dp(12), Ui.dp(12))
                      holder.addView(Ui.tabs(this, tab), Ui.lp(Ui.MP, Ui.WC, 0))
                      outer.addView(holder, Ui.lp(Ui.MP, Ui.WC, 0))
                  }

                  setContentView(outer)
                  return content
              }

              // Header row used by sub-screens: back chevron plus title.
              protected fun header(content: LinearLayout, titleText: String, sub: String) {
                  val row = Ui.row(this)
                  val back = Ui.text(this, "\u2039", 30f, Ui.TEXT, true)
                  back.setPadding(0, 0, Ui.dp(14), Ui.dp(4))
                  back.setOnClickListener { finish() }
                  row.addView(back)
                  val stack = Ui.col(this)
                  stack.addView(Ui.title(this, titleText))
                  if (sub.isNotEmpty()) stack.addView(Ui.text(this, sub, 13f, Ui.MUTED), Ui.lp(Ui.MP, Ui.WC, 2))
                  row.addView(stack, Ui.weighted())
                  content.addView(row, Ui.lp(Ui.MP, Ui.WC, 0))
              }
          }
