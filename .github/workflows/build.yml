name: Build Waqt APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q -d /opt /tmp/gradle.zip
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p keys
            echo "$KEYSTORE_B64" | base64 -d > keys/debug.keystore
            echo "Using the stored signing key."
          else
            echo "::warning::No DEBUG_KEYSTORE_B64 secret set. This build gets a throwaway key and will not install over previous builds."
          fi

      - name: Write project files
        run: |
          set -e
          mkdir -p app/src/main/java/com/waqt app/src/main/res/values app/src/main/res/xml app/src/main/res/drawable

          echo "  settings.gradle.kts"
          cat > settings.gradle.kts << 'PPEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Waqt"
          include(":app")
          PPEOF

          echo "  build.gradle.kts"
          cat > build.gradle.kts << 'PPEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          PPEOF

          echo "  gradle.properties"
          cat > gradle.properties << 'PPEOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          PPEOF

          echo "  app/build.gradle.kts"
          cat > app/build.gradle.kts << 'PPEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          val runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()

          android {
              namespace = "com.waqt"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.waqt"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = runNumber
                  versionName = "1.$runNumber"
              }

              signingConfigs {
                  getByName("debug") {
                      val ks = rootProject.file("keys/debug.keystore")
                      if (ks.exists()) {
                          storeFile = ks
                          storePassword = "android"
                          keyAlias = "androiddebugkey"
                          keyPassword = "android"
                      }
                  }
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          PPEOF

          echo "  app/src/main/AndroidManifest.xml"
          cat > app/src/main/AndroidManifest.xml << 'PPEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:name=".App"
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="uiMode"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity android:name=".AppsActivity" android:configChanges="uiMode" android:exported="false" />
                  <activity android:name=".AppRuleActivity" android:configChanges="uiMode" android:exported="false" />
                  <activity android:name=".CardsActivity" android:configChanges="uiMode" android:exported="false" />
                  <activity android:name=".EditorActivity" android:configChanges="uiMode" android:exported="false" />
                  <activity android:name=".SettingsActivity" android:configChanges="uiMode" android:exported="false" />

                  <service
                      android:name=".GuardService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/acc_config" />
                  </service>

              </application>
          </manifest>
          PPEOF

          echo "  app/src/main/java/com/waqt/App.kt"
          cat > app/src/main/java/com/waqt/App.kt << 'PPEOF'
          package com.waqt

          import android.app.Application
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          class App : Application() {
              override fun onCreate() {
                  super.onCreate()
                  ctx = applicationContext
                  Store.seed()
                  // The accessibility service can build views before any activity runs.
                  Ui.theme(ctx)
              }

              companion object {
                  lateinit var ctx: Context
              }
          }

          // A line of text on a pause screen.
          // Position is an anchor band plus an alignment, never a free x/y fraction, so
          // text can never end up underneath the challenge or the buttons.
          class TextLayer {
              var text = "New text"
              var anchor = CENTER          // TOP / CENTER / BOTTOM band
              var align = 1                // 0 left, 1 centre, 2 right
              var size = 30f
              var color = Color.WHITE
              var font = "sans-serif"
              var bold = false

              fun toJson(): JSONObject {
                  val o = JSONObject()
                  o.put("text", text)
                  o.put("anchor", anchor)
                  o.put("align", align)
                  o.put("size", size.toDouble())
                  o.put("color", color)
                  o.put("font", font)
                  o.put("bold", bold)
                  return o
              }

              companion object {
                  const val TOP = 0
                  const val CENTER = 1
                  const val BOTTOM = 2

                  fun of(text: String, anchor: Int, size: Float, color: Int, bold: Boolean): TextLayer {
                      val t = TextLayer()
                      t.text = text
                      t.anchor = anchor
                      t.size = size
                      t.color = color
                      t.bold = bold
                      return t
                  }

                  fun fromJson(o: JSONObject): TextLayer {
                      val t = TextLayer()
                      t.text = o.optString("text", "")
                      t.anchor = if (o.has("anchor")) {
                          o.optInt("anchor", CENTER)
                      } else {
                          // migrate from the old free-position format
                          val yp = o.optDouble("yp", 0.35)
                          if (yp < 0.34) TOP else if (yp < 0.66) CENTER else BOTTOM
                      }
                      t.align = o.optInt("align", 1)
                      t.size = o.optDouble("size", 30.0).toFloat()
                      t.color = o.optInt("color", Color.WHITE)
                      t.font = o.optString("font", "sans-serif")
                      t.bold = o.optBoolean("bold", false)
                      return t
                  }
              }
          }

          class Card {
              var id = newId()
              var name = "Untitled screen"
              var bgColor = Color.parseColor("#141412")
              var hasImage = false
              var blur = 14
              var dim = 30
              var layers = ArrayList<TextLayer>()

              fun toJson(): JSONObject {
                  val o = JSONObject()
                  o.put("id", id)
                  o.put("name", name)
                  o.put("bgColor", bgColor)
                  o.put("hasImage", hasImage)
                  o.put("blur", blur)
                  o.put("dim", dim)
                  val a = JSONArray()
                  for (l in layers) a.put(l.toJson())
                  o.put("layers", a)
                  return o
              }

              companion object {
                  fun newId(): String =
                      System.currentTimeMillis().toString() + "_" + (1000..9999).random()

                  fun fromJson(o: JSONObject): Card {
                      val c = Card()
                      c.id = o.optString("id", newId())
                      c.name = o.optString("name", "Untitled screen")
                      c.bgColor = o.optInt("bgColor", Color.parseColor("#141412"))
                      c.hasImage = o.optBoolean("hasImage", false)
                      c.blur = o.optInt("blur", 14)
                      c.dim = o.optInt("dim", 30)
                      val a = o.optJSONArray("layers") ?: JSONArray()
                      for (i in 0 until a.length()) c.layers.add(TextLayer.fromJson(a.getJSONObject(i)))
                      return c
                  }
              }
          }

          object Bg {
              private var cacheId = ""
              private var cacheBmp: Bitmap? = null
              private var blurId = ""
              private var blurAmount = -1
              private var blurBmp: Bitmap? = null

              fun file(id: String): File = File(App.ctx.filesDir, "card_$id.jpg")

              fun clearCache(id: String) {
                  if (cacheId == id) {
                      cacheId = ""
                      cacheBmp = null
                  }
                  if (blurId == id) {
                      blurId = ""
                      blurAmount = -1
                      blurBmp = null
                  }
              }

              fun original(id: String): Bitmap? {
                  if (cacheId == id && cacheBmp != null) return cacheBmp
                  val f = file(id)
                  if (!f.exists()) return null
                  val b = try {
                      BitmapFactory.decodeFile(f.absolutePath)
                  } catch (e: Throwable) {
                      null
                  } ?: return null
                  cacheId = id
                  cacheBmp = b
                  return b
              }

              // Cached so that dragging the blur slider does not reallocate three bitmaps per tick.
              fun blurred(id: String, amount: Int): Bitmap? {
                  if (blurId == id && blurAmount == amount && blurBmp != null) return blurBmp
                  val src = original(id) ?: return null
                  if (amount <= 0) return src
                  val out = try {
                      val factor = 1f + amount * 1.1f
                      val w = Math.max(3, (src.width / factor).toInt())
                      val h = Math.max(3, (src.height / factor).toInt())
                      val small = Bitmap.createScaledBitmap(src, w, h, true)
                      val mid = Bitmap.createScaledBitmap(small, Math.max(3, w / 2), Math.max(3, h / 2), true)
                      Bitmap.createScaledBitmap(mid, src.width, src.height, true)
                  } catch (e: Throwable) {
                      src
                  }
                  blurId = id
                  blurAmount = amount
                  blurBmp = out
                  return out
              }

              // Files are written before the card is saved, so anything not referenced by a
              // saved card is an orphan from an abandoned edit.
              fun sweepOrphans() {
                  try {
                      val live = HashSet<String>()
                      for (c in Store.cards()) if (c.hasImage) live.add("card_${c.id}.jpg")
                      val files = App.ctx.filesDir.listFiles() ?: return
                      for (f in files) {
                          if (f.name.startsWith("card_") && f.name.endsWith(".jpg") && !live.contains(f.name)) {
                              f.delete()
                          }
                      }
                  } catch (e: Throwable) {
                  }
              }
          }
          PPEOF

          echo "  app/src/main/java/com/waqt/Store.kt"
          cat > app/src/main/java/com/waqt/Store.kt << 'PPEOF'
          package com.waqt

          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Color
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          object Store {

              private val sp: SharedPreferences by lazy {
                  App.ctx.getSharedPreferences("waqt", Context.MODE_PRIVATE)
              }

              private fun fmt(d: Date): String = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(d)
              private fun today(): String = fmt(Date())

              private fun obj(key: String): JSONObject = try {
                  JSONObject(sp.getString(key, "{}") ?: "{}")
              } catch (e: Throwable) {
                  JSONObject()
              }

              private fun put(key: String, o: JSONObject) {
                  sp.edit().putString(key, o.toString()).apply()
              }

              // ---- day rollover, archiving yesterday into history ----

              fun rollDay() {
                  val prev = sp.getString("day", "") ?: ""
                  if (prev == today()) return
                  if (prev.isNotEmpty()) {
                      val hist = obj("hist")
                      val entry = JSONObject()
                      entry.put("o", opensRaw())
                      entry.put("b", sp.getInt("goBacks", 0))
                      hist.put(prev, entry)
                      trim(hist)
                      put("hist", hist)
                  }
                  sp.edit()
                      .putString("day", today())
                      .putString("opens", "{}")
                      .putInt("goBacks", 0)
                      .putInt("passUsed", 0)
                      .apply()
              }

              private fun trim(hist: JSONObject) {
                  val keys = ArrayList<String>()
                  val it = hist.keys()
                  while (it.hasNext()) keys.add(it.next())
                  keys.sort()
                  while (keys.size > 30) {
                      hist.remove(keys.removeAt(0))
                  }
              }

              private fun opensRaw(): Int {
                  val o = obj("opens")
                  var total = 0
                  val it = o.keys()
                  while (it.hasNext()) total += o.optInt(it.next(), 0)
                  return total
              }

              class Day(val label: String, val opens: Int, val backs: Int, val isToday: Boolean)

              // Last seven days, oldest first, for the bar strip on the home screen.
              fun lastSevenDays(): List<Day> {
                  rollDay()
                  val hist = obj("hist")
                  val out = ArrayList<Day>()
                  val cal = Calendar.getInstance()
                  cal.add(Calendar.DAY_OF_YEAR, -6)
                  val letters = SimpleDateFormat("EEEEE", Locale.US)
                  for (i in 0..6) {
                      val key = fmt(cal.time)
                      val label = letters.format(cal.time)
                      if (key == today()) {
                          out.add(Day(label, opensToday(), goBacks(), true))
                      } else {
                          val e = hist.optJSONObject(key)
                          out.add(Day(label, e?.optInt("o", 0) ?: 0, e?.optInt("b", 0) ?: 0, false))
                      }
                      cal.add(Calendar.DAY_OF_YEAR, 1)
                  }
                  return out
              }

              // ---- theme ----

              const val THEME_SYSTEM = 0
              const val THEME_LIGHT = 1
              const val THEME_DARK = 2

              fun themeMode(): Int = sp.getInt("theme", THEME_SYSTEM)
              fun setThemeMode(v: Int) = sp.edit().putInt("theme", v).apply()

              // ---- global settings ----

              fun enabled(): Boolean = sp.getBoolean("enabled", true)
              fun setEnabled(v: Boolean) = sp.edit().putBoolean("enabled", v).apply()

              fun guarded(): MutableSet<String> = HashSet(sp.getStringSet("guarded", HashSet()) ?: HashSet())
              fun setGuarded(s: Set<String>) = sp.edit().putStringSet("guarded", HashSet(s)).apply()

              fun preWait(): Int = sp.getInt("preWait", 5)
              fun setPreWait(v: Int) = sp.edit().putInt("preWait", v).apply()

              fun midMinutes(): Int = sp.getInt("mid", 8)
              fun setMidMinutes(v: Int) = sp.edit().putInt("mid", v).apply()

              fun graceMinutes(): Int = sp.getInt("grace", 2)
              fun setGraceMinutes(v: Int) = sp.edit().putInt("grace", v).apply()

              fun escalate(): Boolean = sp.getBoolean("esc", true)
              fun setEscalate(v: Boolean) = sp.edit().putBoolean("esc", v).apply()

              fun passesPerDay(): Int = sp.getInt("passes", 3)
              fun setPassesPerDay(v: Int) = sp.edit().putInt("passes", v).apply()

              // ---- counters ----

              fun opensOf(pkg: String): Int {
                  rollDay()
                  return obj("opens").optInt(pkg, 0)
              }

              fun bumpOpen(pkg: String): Int {
                  rollDay()
                  val o = obj("opens")
                  val n = o.optInt(pkg, 0) + 1
                  o.put(pkg, n)
                  put("opens", o)
                  return n
              }

              fun opensToday(): Int {
                  rollDay()
                  return opensRaw()
              }

              fun goBacks(): Int {
                  rollDay()
                  return sp.getInt("goBacks", 0)
              }

              fun bumpGoBack() {
                  rollDay()
                  sp.edit().putInt("goBacks", sp.getInt("goBacks", 0) + 1).apply()
              }

              // ---- grace window ----
              //
              // Leaving an app normally starts a short free re-entry window. Refusing at the
              // pause screen must NOT, or every refusal would hand back free access. The deny
              // stamp wins over the leave stamp for the length of the grace window.

              fun markLeft(pkg: String) {
                  if (deniedRecently(pkg)) return
                  val o = obj("left")
                  o.put(pkg, System.currentTimeMillis())
                  put("left", o)
              }

              fun markDenied(pkg: String) {
                  val o = obj("denied")
                  o.put(pkg, System.currentTimeMillis())
                  put("denied", o)
                  val l = obj("left")
                  l.remove(pkg)
                  put("left", l)
              }

              private fun deniedRecently(pkg: String): Boolean {
                  val t = obj("denied").optLong(pkg, 0L)
                  return t > 0L && System.currentTimeMillis() - t < Math.max(60000L, graceMinutes() * 60000L)
              }

              fun inGrace(pkg: String): Boolean {
                  if (graceMinutes() <= 0) return false
                  if (deniedRecently(pkg)) return false
                  val t = obj("left").optLong(pkg, 0L)
                  return t > 0L && System.currentTimeMillis() - t < graceMinutes() * 60000L
              }

              // ---- work passes ----

              fun passesLeft(): Int {
                  rollDay()
                  return Math.max(0, passesPerDay() - sp.getInt("passUsed", 0))
              }

              fun startPass(pkg: String) {
                  rollDay()
                  sp.edit()
                      .putInt("passUsed", sp.getInt("passUsed", 0) + 1)
                      .putString("passPkg", pkg)
                      .putLong("passEnd", System.currentTimeMillis() + 15 * 60000L)
                      .apply()
              }

              fun passActive(pkg: String): Boolean =
                  sp.getString("passPkg", "") == pkg && System.currentTimeMillis() < sp.getLong("passEnd", 0L)

              // ---- active hours ----

              fun winOn(): Boolean = sp.getBoolean("winOn", false)
              fun winStart(): Int = sp.getInt("winStart", 9 * 60)
              fun winEnd(): Int = sp.getInt("winEnd", 18 * 60)
              fun winInvert(): Boolean = sp.getBoolean("winInv", false)

              fun setWin(key: String, value: Int) {
                  when (key) {
                      "on" -> sp.edit().putBoolean("winOn", value == 1).apply()
                      "start" -> sp.edit().putInt("winStart", value).apply()
                      "end" -> sp.edit().putInt("winEnd", value).apply()
                      "inv" -> sp.edit().putBoolean("winInv", value == 1).apply()
                  }
              }

              fun globalHours(): IntArray = intArrayOf(
                  if (winOn()) 1 else 0, winStart(), winEnd(), if (winInvert()) 1 else 0
              )

              // ---- per-app overrides ----

              fun rule(pkg: String): JSONObject = obj("rules").optJSONObject(pkg) ?: JSONObject()

              private fun putRule(pkg: String, r: JSONObject) {
                  val all = obj("rules")
                  all.put(pkg, r)
                  put("rules", all)
              }

              fun customTiming(pkg: String): Boolean = rule(pkg).optBoolean("ct", false)
              fun customHours(pkg: String): Boolean = rule(pkg).optBoolean("ch", false)
              fun isCustom(pkg: String): Boolean = customTiming(pkg) || customHours(pkg)

              fun setCustomTiming(pkg: String, on: Boolean) {
                  val r = rule(pkg)
                  r.put("ct", on)
                  if (on) {
                      if (!r.has("preWait")) r.put("preWait", preWait())
                      if (!r.has("mid")) r.put("mid", midMinutes())
                  }
                  putRule(pkg, r)
              }

              fun setCustomHours(pkg: String, on: Boolean) {
                  val r = rule(pkg)
                  r.put("ch", on)
                  if (on) {
                      if (!r.has("wOn")) r.put("wOn", true)
                      if (!r.has("wStart")) r.put("wStart", winStart())
                      if (!r.has("wEnd")) r.put("wEnd", winEnd())
                      if (!r.has("wInv")) r.put("wInv", winInvert())
                  }
                  putRule(pkg, r)
              }

              fun setRuleInt(pkg: String, key: String, value: Int) {
                  val r = rule(pkg)
                  r.put(key, value)
                  putRule(pkg, r)
              }

              fun setAppWin(pkg: String, key: String, value: Int) {
                  val r = rule(pkg)
                  when (key) {
                      "on" -> r.put("wOn", value == 1)
                      "start" -> r.put("wStart", value)
                      "end" -> r.put("wEnd", value)
                      "inv" -> r.put("wInv", value == 1)
                  }
                  putRule(pkg, r)
              }

              fun appHours(pkg: String): IntArray {
                  val r = rule(pkg)
                  if (!r.optBoolean("ch", false)) return globalHours()
                  return intArrayOf(
                      if (r.optBoolean("wOn", true)) 1 else 0,
                      r.optInt("wStart", winStart()),
                      r.optInt("wEnd", winEnd()),
                      if (r.optBoolean("wInv", false)) 1 else 0
                  )
              }

              fun preWaitFor(pkg: String): Int {
                  val r = rule(pkg)
                  return if (r.optBoolean("ct", false)) r.optInt("preWait", preWait()) else preWait()
              }

              fun midMinutesFor(pkg: String): Int {
                  val r = rule(pkg)
                  return if (r.optBoolean("ct", false)) r.optInt("mid", midMinutes()) else midMinutes()
              }

              fun activeNow(pkg: String): Boolean {
                  val h = appHours(pkg)
                  if (h[0] == 0) return true
                  val cal = Calendar.getInstance()
                  val now = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE)
                  val start = h[1]
                  val end = h[2]
                  val inside = if (start == end) {
                      true
                  } else if (start < end) {
                      now >= start && now < end
                  } else {
                      now >= start || now < end
                  }
                  return if (h[3] == 1) !inside else inside
              }

              // One-line human summary of an app's rule, shown under its name in the list.
              fun ruleSummary(pkg: String): String {
                  val h = appHours(pkg)
                  val when_ = if (h[0] == 0) {
                      "All day"
                  } else if (h[3] == 1) {
                      "Outside " + fmtTime(h[1]) + "\u2013" + fmtTime(h[2])
                  } else {
                      fmtTime(h[1]) + "\u2013" + fmtTime(h[2])
                  }
                  val m = midMinutesFor(pkg)
                  val every = if (m <= 0) "opening only" else "every $m min"
                  return "$when_ \u00b7 $every"
              }

              fun fmtTime(mins: Int): String {
                  val total = ((mins % 1440) + 1440) % 1440
                  val h24 = total / 60
                  val m = total % 60
                  val suffix = if (h24 < 12) "AM" else "PM"
                  var h = h24 % 12
                  if (h == 0) h = 12
                  return h.toString() + (if (m == 0) "" else ":" + (if (m < 10) "0" else "") + m) + " " + suffix
              }

              // ---- pause screens ----

              fun cards(): ArrayList<Card> {
                  val list = ArrayList<Card>()
                  try {
                      val a = JSONArray(sp.getString("cards", "[]") ?: "[]")
                      for (i in 0 until a.length()) list.add(Card.fromJson(a.getJSONObject(i)))
                  } catch (e: Throwable) {
                  }
                  return list
              }

              fun saveCards(list: List<Card>) {
                  val a = JSONArray()
                  for (c in list) a.put(c.toJson())
                  sp.edit().putString("cards", a.toString()).apply()
              }

              fun pickCard(): Card {
                  val list = cards()
                  if (list.isEmpty()) return defaults()[0]
                  return list[(0 until list.size).random()]
              }

              fun seed() {
                  if (sp.contains("cards")) return
                  saveCards(defaults())
              }

              private fun defaults(): ArrayList<Card> {
                  val list = ArrayList<Card>()

                  val a = Card()
