                  heroCard()
                  metricCards()
                  guardCard()

                  content.addView(Ui.button(this, "Show me a pause screen", true) {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Allow drawing over other apps first", Toast.LENGTH_LONG).show()
                      } else {
                          Overlay.show(this, "preview", Overlay.PREVIEW, 1) {}
                      }
                  }, Ui.lp(Ui.MP, Ui.WC, 12))

                  content.addView(
                      Ui.text(
