          package com.waqt

          import android.os.Bundle
          import android.widget.LinearLayout

          class SettingsActivity : Base() {

              override fun onCreate(saved: Bundle?) {
                  super.onCreate(saved)
                  val content = scaffold(3)

                  content.addView(Ui.title(this, "Settings"))
                  content.addView(
                      Ui.text(this, "Defaults for every guarded app. Any app can override them.", 13f, Ui.MUTED),
                      Ui.lp(Ui.MP, Ui.WC, 2)
                  )

                  appearance(content)
                  timing(content)
                  hours(content)

                  content.addView(
                      Ui.text(
                          this,
                          "To stop Waqt completely, turn it off under Android accessibility settings.",
                          12f,
                          Ui.MUTED
                      ),
                      Ui.lp(Ui.MP, Ui.WC, 20)
                  )
              }

              private fun appearance(content: LinearLayout) {
                  val p = Ui.panel(this)
                  p.addView(Ui.eyebrow(this, "Appearance"))
                  p.addView(
                      Ui.text(this, "System follows your phone's light and dark setting.", 12f, Ui.MUTED),
                      Ui.lp(Ui.MP, Ui.WC, 6)
                  )
                  p.addView(
                      Ui.segmented(this, arrayOf("System", "Light", "Dark"), Store.themeMode()) { picked ->
                          if (picked != Store.themeMode()) {
                              Store.setThemeMode(picked)
                              recreate()
                          }
                      },
                      Ui.lp(Ui.MP, Ui.WC, 12)
                  )
                  p.addView(
                      Ui.text(this, "Pause screens keep their own colours either way.", 12f, Ui.MUTED),
                      Ui.lp(Ui.MP, Ui.WC, 12)
                  )
                  content.addView(p, Ui.lp(Ui.MP, Ui.WC, 20))
              }

              private fun timing(content: LinearLayout) {
                  val p = Ui.panel(this)
                  p.addView(Ui.eyebrow(this, "Default timing"))
                  Ui.slider(p, "Wait before you can act", 0, 15, Store.preWait(),
                      { if (it == 0) "none" else it.toString() + "s" }, { Store.setPreWait(it) })
                  Ui.slider(p, "Interrupt every", 0, 30, Store.midMinutes(),
                      { if (it == 0) "off" else "$it min" }, { Store.setMidMinutes(it) })
                  Ui.slider(p, "Free re-entry window", 0, 10, Store.graceMinutes(),
                      { if (it == 0) "none" else "$it min" }, { Store.setGraceMinutes(it) })
                  Ui.slider(p, "Work passes per day", 0, 6, Store.passesPerDay(),
                      { if (it == 0) "none" else it.toString() }, { Store.setPassesPerDay(it) })

                  Ui.pillRow(
                      this, p,
                      "Get harder as the day goes",
                      "Open 12 should not feel like open 1.",
                      Store.escalate(),
                      22
                  ) { Store.setEscalate(it) }

                  p.addView(
                      Ui.text(
                          this,
                          "Turning back after a pause screen never opens a free re-entry window \u2014 only leaving an app normally does.",
                          12f,
                          Ui.MUTED
                      ),
                      Ui.lp(Ui.MP, Ui.WC, 16)
                  )
                  content.addView(p, Ui.lp(Ui.MP, Ui.WC, 14))
              }

              private fun hours(content: LinearLayout) {
                  val p = Ui.panel(this)
                  p.addView(Ui.eyebrow(this, "Default hours"))
                  Ui.hoursBlock(this, p, { Store.globalHours() }, { k, v -> Store.setWin(k, v) })
                  p.addView(
                      Ui.text(
                          this,
                          "Worth knowing: a daily free window is a window your habit will move into. Leaving this off is usually stronger.",
                          12f,
                          Ui.MUTED
                      ),
                      Ui.lp(Ui.MP, Ui.WC, 14)
                  )
                  content.addView(p, Ui.lp(Ui.MP, Ui.WC, 14))
              }
          }
